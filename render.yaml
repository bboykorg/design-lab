# Render.com Blueprint — one-click deploy.
services:
  - type: web
    name: design-lab
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # PROJECTS_DATABASE_URL takes priority; JSON is only a safe local fallback.
      - key: STORE
        value: json
      - key: PROJECTS_DATABASE_URL
        sync: false
      - key: AUTH_ENABLED
        value: "1"
      - key: CORS_ORIGINS
        value: "https://desing-lab.onrender.com"
      - key: MAX_PROXY_BODY
        value: "2097152"
      - key: RATE_AUDIT_LIMIT
        value: "30"
      - key: RATE_AUDIT_WINDOW
        value: "3600"
      - key: ADMIN_API_TOKEN
        generateValue: true
      - key: USER_DB_SERVICE_URL
        sync: false
      - key: SERVICE_API_TOKEN
        sync: false
      - key: GOROUTER_API_KEYS
        sync: false
      - key: KIWILLM_API_KEYS
        sync: false
      - key: VYCE_API_KEYS
        sync: false
      - key: CEREBRAS_API_KEYS
        sync: false
      - key: OPENROUTER_API_KEYS
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: GLM_API_KEYS
        sync: false
      - key: MISTRAL_API_KEYS
        sync: false
      - key: OCR_SPACE_API_KEYS
        sync: false
      - key: PUBLIC_URL
        sync: false
