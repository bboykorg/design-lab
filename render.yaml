# Render.com Blueprint — one-click deploy.
services:
  - type: web
    name: design-lab
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: STORE
        value: json
      - key: CORS_ORIGINS
        value: "*"
      # Base URL of a separate persistent service for users, sessions and projects.
      - key: USER_DB_SERVICE_URL
        sync: false
      # AI provider keys for /api/proxy (comma-separated for several keys).
      - key: GOROUTER_API_KEYS
        sync: false
      - key: KIWILLM_API_KEYS
        sync: false
      - key: VYCE_API_KEYS
        sync: false
      - key: CEREBRAS_API_KEYS
        sync: false
      - key: OPENROUTER_API_KEYS
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: GLM_API_KEYS
        sync: false
      - key: MISTRAL_API_KEYS
        sync: false
      - key: OCR_SPACE_API_KEYS
        sync: false
      - key: PUBLIC_URL
        sync: false
