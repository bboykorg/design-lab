# Render.com Blueprint — one-click deploy.
# The AI provider keys below are secrets (sync: false) — Render will prompt for
# them on deploy. They power the /api/proxy relay used by the frontend.
services:
  - type: web
    name: design-lab
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: STORE
        value: json
      - key: CORS_ORIGINS
        value: "*"
      # AI provider keys for /api/proxy (comma-separated to use several per provider).
      - key: CEREBRAS_API_KEYS
        sync: false
      - key: OPENROUTER_API_KEYS
        sync: false
      - key: ANTHROPIC_API_KEYS
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: GLM_API_KEYS
        sync: false
      - key: MISTRAL_API_KEYS
        sync: false
      - key: PUBLIC_URL
        sync: false
