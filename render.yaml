# Render.com Blueprint — one-click deploy.
# The AI key below is a secret (sync: false) — Render will prompt for it on
# deploy. It powers the /api/proxy relay used by the frontend.
services:
  - type: web
    name: design-lab
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: STORE
        value: json
      - key: CORS_ORIGINS
        value: "*"
      # Single AI key for /api/proxy (comma-separated to rotate several).
      - key: AI_API_KEY
        sync: false
      - key: PUBLIC_URL
        sync: false
