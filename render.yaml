# Render.com Blueprint — one-click deploy.
# Set AI_API_KEY in the Render dashboard (secret, not committed).
services:
  - type: web
    name: design-lab
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: AI_MODEL
        value: qwen/qwen3-coder:free
      - key: AI_API_KEY
        sync: false
      - key: STORE
        value: json
      - key: CORS_ORIGINS
        value: "*"
